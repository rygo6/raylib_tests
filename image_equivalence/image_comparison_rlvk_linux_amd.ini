# raylib image-comparison configuration - VULKAN BACKEND (rlvk) on LINUX / AMD (Mesa RADV).
#
# WHY THIS FILE EXISTS (2026-08-02)
# The committed rlgl_baseline is a Windows/NVIDIA capture, so diffing a Linux/AMD rlvk run
# against it mixes three variables: backend, GPU vendor and OS. This config gates rlvk against
# rlgl_baseline_linux_amd - the SAME machine's GL output - so only the backend varies.
#
# WHY THE BUDGETS ARE LARGE HERE (they are not in the NVIDIA config)
# Bit-exact GL/Vulkan equivalence turned out to be an NVIDIA-specific property. Measured on this
# machine, holding the BACKEND fixed and changing only the driver produces MORE difference than
# changing the backend:
#     rlgl on radeonsi  vs  rlgl on llvmpipe   129 failing frames   <- same GL code, two drivers
#     rlvk on RADV      vs  rlvk on lavapipe   120 failing frames   <- same VK code, two drivers
#     rlvk on RADV      vs  rlgl on radeonsi   117 failing frames   <- this comparison
#     rlvk on lavapipe  vs  rlgl on llvmpipe    83 failing frames   <- closest pairing measured
# Every scene that differs across the APIs also differs when only the driver changes, so at the
# pass/fail level the residual uniquely attributable to rlvk is zero. So ~120 frames is this
# platform's ambient noise floor for ANY implementation swap, and a gate demanding near-exactness
# here would be measuring Mesa, not rlvk. What this gate asserts instead: no scene exceeds its
# measured floor by more than ~3x.
#
# REFINEMENT (2026-08-02): comparing MAGNITUDES rather than verdicts, 19 of 75 scenes do differ
# more across the APIs than across drivers, by small margins - worst cases
# models_cubicmap_rendering 454 px vs a 45 px driver floor, shaders_simple_mask 466 vs 124,
# models_basic_voxel 330 vs 62, models_first_person_maze 147 vs 13, models_textured_cube 82 vs 0.
# Mostly textured 3D scenes with edge-located differences. The depth-precision hypothesis
# (rlvk forces D32_SFLOAT; Mesa GL default framebuffers measure GL_DEPTH_BITS=24 on both
# radeonsi and llvmpipe) was TESTED AND REFUTED 2026-08-03: on lavapipe, which offers 24-bit
# depth formats, forcing the swapchain depth buffer to X8_D24_UNORM_PACK32 produced
# bit-identical output to D32 across all 19 scenes - and a D16 control on the same instrument
# visibly changed models_geometric_shapes, proving the format selection was honored, so the
# null result is meaningful. The excess remains unattributed pair-specific rasterization
# variance (the driver-only floor compares a different implementation pair, so it bounds the
# noise only approximately). The 19 scenes are NOT what the loose budgets below are absorbing -
# for every one of the six largest budgets the driver-only floor is equal or larger, so those
# budgets are conservative rather than slack.
#
# Additional evidence that the differences are not defects: 97-100% of differing pixels sit on
# high-contrast EDGES (boundary placement), with interior shading essentially untouched, on every
# scene sampled.
#
# Budgets below are the worst measured frame per scene (run 2026-08-02, rlvk vs rlgl_baseline_linux_amd,
# both captured on this machine) times ~3. Regenerate with the same method after driver updates -
# a Mesa release can move the floor. A REAL regression should still stand out: genuine rlvk bugs
# have historically measured thousands of pixels ACROSS MANY scenes at once, and would also show
# up as interior rather than edge differences.
# GATE SENSITIVITY (measured 2026-08-02, be aware of this when reading a PASS)
# Verified to catch a regression: an injected interior shift on shapes_basic_shapes was flagged
# at 350k px. But detection is only as tight as each budget: of 66 allowances the median is 300
# px and 34 are <= 500 px, while the six loosest are text_3d_drawing 30000, shaders_model_shader
# 22000, shaders_cel_shading 14000, shaders_basic_lighting 12000, audio_module_playing 8500 and
# shaders_eratosthenes_sieve 7500. A regression confined to ONE of those scenes and smaller than
# its budget would pass unnoticed. Those six are text/lighting-shader scenes where AMD's GL and
# Vulkan paths genuinely disagree most; tightening them needs the underlying difference
# understood, not a smaller number.
#
# (read via rini - key<space>value, "#" comments)
examples_dir  ../../raylib/examples
frames        0,10,30
timeout_ms    8000

# Comparison settings
ref_dir       rlgl_baseline_linux_amd
cmp_dir       rlvk
diff_dir      diffs_rlvk_linux_amd
report        report_rlvk_linux_amd.html
tolerance     2
spatial_tolerance 1   # absorb 1px line/curve rasterization tie-break shifts between drivers

# Examples excluded from comparison: inherently non-deterministic, no fixed timestep can help.
# One 'exclude' line per example (a comma-separated list on a single line also works).
exclude       shapes_digital_clock     # renders the real system wall-clock (libc time())
exclude       shapes_clock_of_clocks   # renders the real system wall-clock (libc time())
exclude       audio_raw_stream         # visualizes the live audio buffer (real-time audio thread)
exclude       audio_stream_callback    # visualizes the live audio buffer (real-time audio thread)
exclude       core_window_flags        # displays live window focus state (OS/WM decides, not the frame clock)
exclude       raylib_opengl_interop    # renders via raw OpenGL calls (GL interop demo) - not meaningful for a Vulkan backend
exclude       core_custom_frame_control  # drives its own frame loop (manual SwapScreenBuffer/PollInputEvents), never calls EndDrawing where the capture hook lives, so it never exits and always hits the timeout
exclude       shaders_rlgl_compute     # compute shaders not implemented in rlvk (rlComputeShaderDispatch stub); its FS reads an SSBO the layout cannot yet bind

# These examples have knife-edge outcomes that legitimately differ between graphics backends
# on the SAME data: cross-compiler float ULP flips fractal escape-iteration counts at set
# boundaries, 1-ULP clip-coordinate differences shift snapped silhouette edges one 1/256
# subpixel step, and lighting math (pow/normalize) lands one step above the channel tolerance
# on scattered pixels. Frames within budget report as PASS~ and are listed in the HTML report.
# Budgets are sized from measured worst frames (2026-07-04, run 30) with ~3x headroom; real
# regressions have always measured >= 1000s of pixels. Frame size is 360000 px (800x450).

# -- fractal boundary ULP (escape-time iteration count flips at 1-ULP differences) --

# -- silhouette / texel-boundary ties (1-ULP clip coords shift snapped edges a subpixel) --

# -- shading ULP just above channel tolerance (pow/normalize noise on lit surfaces) --

# -- MSAA edge coverage (ACCEPTED POLICY 2026-07-07): rlvk uses standard Vulkan MSAA (the
# implementation's sample pattern + fixed-function AVERAGE resolve) instead of replicating
# GL's pattern and sRGB-correct resolve, so every FLAG_MSAA_4X scene differs from the GL
# baseline along antialiased edges. Budgets sized from measured worst frames (2026-07-07)
# with ~3x headroom; an MSAA-scene regression shows as tens of thousands of pixels or a
# fully different image, well above these budgets. --

# -- measured per-scene budgets (worst frame x ~3), see header --
