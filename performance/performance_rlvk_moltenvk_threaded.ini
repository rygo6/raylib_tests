# raylib performance-capture configuration - rlvk through the THREADED-PRESENT patched moltenvk.
#
# Patched ICDs (app thread never touches a CAMetalDrawable; worker thread absorbs the
# drawable pacing with latest-wins dropping): MoltenVK ~/Developer/MoltenVK branch
# threaded-present (MVK_THREADED_PRESENT=1 opt-in), KosmicKrisp ~/Developer/mesa branch
# kk-threaded-present (engages automatically). Select the local build at run time:
#   MoltenVK:    VK_DRIVER_FILES=~/Developer/MoltenVK/Package/Release/MoltenVK/dynamic/dylib/macOS/MoltenVK_icd.json MVK_THREADED_PRESENT=1
#   KosmicKrisp: VK_DRIVER_FILES=~/Developer/mesa/build/src/kosmickrisp/vulkan/kosmickrisp_mesa_devenv_icd.aarch64.json
# (read via rini - "key<space>value", '#' comments)

backend         rlvk
examples_dir    ../../raylib/examples
capture_output  rlvk
label           macos_moltenvk_threaded
duration_ms     10000
warmup_ms       500
runs            3
timeout_ms      30000

examples        shapes/shapes_basic_shapes, textures/textures_tiled_drawing, textures/textures_particles_blending, shapes/shapes_starfield_effect, models/models_loading, models/models_heightmap_rendering, models/models_skybox_rendering, models/models_waving_cubes, models/models_first_person_maze, core/core_3d_camera_free, shaders/shaders_basic_lighting, shaders/shaders_basic_pbr, shaders/shaders_mandelbrot_set, shaders/shaders_raymarching_rendering, others/performance_stress_test, others/performance_stress_test_direct, others/bench_idle, others/bench_drawcalls, others/bench_instanced
