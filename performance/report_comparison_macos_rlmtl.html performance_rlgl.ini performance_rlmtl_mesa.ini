<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>raylib perf - comparison</title><style>:root{--bg:#0f1116;--card:#171a21;--line:#262b36;--txt:#e6e9ef;--dim:#9aa4b2;--acc:#6ea8fe;--good:#54d18c;--bad:#ff6b6b;--warn:#ffcf5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:28px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 10px;color:var(--acc)}.env{color:var(--dim);margin:0 0 8px;font-size:13px}.env b{color:var(--txt)}.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:10px 0}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}th{background:#1c2029;color:var(--dim);font-weight:600;position:sticky;top:0;text-align:right}td.name,th.name{text-align:left;color:var(--txt);font-weight:600}tr:last-child td{border-bottom:none}tr:hover td{background:#1b1f28}.best{color:var(--good);font-weight:700}.worst{color:var(--bad)}.sub{color:var(--dim);font-size:12px}.na{color:var(--dim)}.callout{border-left:4px solid var(--acc);background:rgba(128,128,128,0.08);padding:10px 14px;margin:14px 0;font-size:13px;line-height:1.5}.callout b{color:var(--acc)}details{margin:6px 0}summary{cursor:pointer;color:var(--acc);font-size:13px}caption{caption-side:top;text-align:left;color:var(--dim);padding:8px 12px;font-size:12px}</style></head><body><h1>raylib performance &mdash; backend comparison</h1><p class=env><b>rlgl</b> &nbsp;|&nbsp; <b>GPU</b> Apple M5 (24576 MB) &nbsp;|&nbsp; <b>Driver</b> MoltenVK 1.4.2 &nbsp;|&nbsp; <b>OS</b> macOS 26.5.1 &nbsp;|&nbsp; 1 runs &times; 60000 ms full speed</p><p class=sub>Green = best backend for that example/metric, red = worst. Frame time &amp; FPS are the representative run; software (rlsw) has no GPU 